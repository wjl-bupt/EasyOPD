# EasyOPD `simct` — span-based cross-tokenizer on-policy distillation config template
#
# `simct` is the EasyOPD name for KDFlow's original `span_ctkd` method. It
# reuses the `simple` teacher sidecar and hidden-state transport, then applies
# span-level virtual-vocabulary KD in the student forward pass.
#
# Required toggles:
#   - distillation.enabled=true
#   - distillation.distillation_loss.loss_mode=simct
#   - distillation.distillation_loss.cross_tokenizer_kl_direction=reverse

_defaults_note: "Combine this EasyOPD-specific template with the standard verl PPO trainer Hydra config."

# ---------- student model & rollout ---------- #
student_model_path: Qwen/Qwen3-8B
student_tokenizer_path: Qwen/Qwen3-8B

# ---------- teacher model ---------- #
teacher_model_path: meta-llama/Llama-3.2-3B-Instruct
teacher_tokenizer_path: meta-llama/Llama-3.2-3B-Instruct

# ---------- training ---------- #
train_batch_size: 64
ppo_mini_batch_size: 64
max_prompt_length: 1024
max_response_length: 1024
actor_lr: 1.0e-6
total_epochs: 5

# ---------- distillation overrides ---------- #
distillation:
  enabled: true
  n_gpus_per_node: 4
  nnodes: 1
  distillation_loss:
    loss_mode: simct
    use_policy_gradient: false
    use_task_rewards: false
    distillation_loss_coef: 1.0
    loss_max_clamp: 10.0
    cross_tokenizer_kl_direction: reverse

# ---------- data ---------- #
data:
  # Option 1 (Recommended): HuggingFace dataset (auto-download + convert)
  dataset: "openai/gsm8k"
  dataset_split: "train"
  val_split: "test"
  prompt_template: "math_qa"

  # Option 2: Local Parquet files (overrides Option 1)
  # train_files: ["/path/to/your/train.parquet"]
  # val_files: ["/path/to/your/val.parquet"]

  prompt_key: content
  max_prompt_length: 1024
  truncation: right
