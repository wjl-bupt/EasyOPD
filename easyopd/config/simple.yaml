# EasyOPD `simple` — cross-tokenizer on-policy distillation config template
#
# This template only carries the EasyOPD-specific overrides. Combine it
# with the standard verl PPO trainer hydra config (see `examples/simple/run_simple.sh`)
# via Hydra CLI overrides; the shell script is the canonical entry point.
#
# Required toggles:
#   - distillation.enabled=true
#   - distillation.distillation_loss.loss_mode=simple        # routes to compute_distillation_loss_simple_cross_tokenizer
#   - distillation.distillation_loss.cross_tokenizer_kl_direction=forward|reverse
#
# Notes:
#   * In `simple` mode the teacher runs an INDEPENDENT HuggingFace forward
#     to obtain full-vocab logits column-cropped to the student/teacher
#     overlap sub-vocabulary. The vllm/sglang teacher path is bypassed
#     (`validate_and_prepare_for_distillation` skips the response_length=1
#     rewrite when use_cross_tokenizer=True).
#   * `use_task_rewards=False` is recommended initially so the gradient
#     signal is purely the distillation KL.

defaults:
  - _self_

# ---------- student model & rollout ---------- #
student_model_path: Qwen/Qwen3-8B
student_tokenizer_path: Qwen/Qwen3-8B   # usually identical to model_path

# ---------- teacher model (HF forward, NOT vllm/sglang) ---------- #
teacher_model_path: meta-llama/Llama-3.2-3B-Instruct
teacher_tokenizer_path: meta-llama/Llama-3.2-3B-Instruct

# ---------- training ---------- #
train_batch_size: 64
ppo_mini_batch_size: 64
max_prompt_length: 1024
max_response_length: 1024
actor_lr: 1.0e-6
total_epochs: 5

# ---------- distillation overrides (consumed by the shell script) ---------- #
distillation:
  enabled: true
  n_gpus_per_node: 4
  nnodes: 1
  distillation_loss:
    loss_mode: simple
    use_policy_gradient: false           # supervised KD path is the simplest starting point
    use_task_rewards: false
    distillation_loss_coef: 1.0
    loss_max_clamp: 10.0
    cross_tokenizer_kl_direction: forward  # "forward" or "reverse"

# Same-tokenizer fallback (e.g. quick sanity check):
#   set teacher_model_path == student_model_path and the alignment falls
#   into the identity fast path, so simple ≈ full-vocab forward KL.

# ---------- data ---------- #
data:
  # Option 1 (Recommended): HuggingFace dataset (auto-download + convert)
  dataset: "openai/gsm8k"
  dataset_split: "train"
  val_split: "test"
  prompt_template: "math_qa"

  # Option 2: Local Parquet files (overrides Option 1)
  # train_files: ["/path/to/your/train.parquet"]
  # val_files: ["/path/to/your/val.parquet"]

  prompt_key: content
  max_prompt_length: 1024
  truncation: right
