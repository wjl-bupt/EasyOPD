# Lightning-OPD: Offline On-Policy Distillation
# Paper: https://arxiv.org/abs/2604.13010
#
# This config defines the Lightning-OPD training defaults.
# Use with: python3 -m verl.trainer.main_ppo \
#     --config-path <path_to_this_dir> --config-name base ...

algorithm:
  adv_estimator: on_policy_distillation
  use_kl_in_reward: False
  gamma: 1.0
  lam: 1.0
  kl_penalty: kl

distillation:
  # Lightning-OPD does NOT use a live teacher Ray cluster.
  # Teacher logprobs are precomputed offline in the parquet data.
  enabled: False

actor_rollout_ref:
  actor:
    ppo_mini_batch_size: 256
    use_dynamic_bsz: True
    use_kl_loss: False
    kl_loss_coef: 0.0
    loss_agg_mode: token-mean
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    optim:
      lr: 2e-6
      warmup_style: constant
  rollout:
    # Lightning-OPD uses n=1 (single sample per prompt, not GRPO-style)
    n: 1
    name: vllm
